# Stack de producción: db + lycet (sidecar SUNAT) + web (Next.js standalone) + cron (supercronic).
# Uso: copia .env.prod.example a .env, completa los obligatorios y ejecuta
#      docker compose -f docker-compose.prod.yml up -d --build
# Los valores obligatorios usan ${VAR:?mensaje}: sin ellos el `up` falla a
# propósito (no se despliega con secretos inseguros por defecto).

name: odontoflow-prod

services:
  db:
    image: postgres:16
    container_name: odontoflow-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odontoflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatorio (ver .env.prod.example)}
      POSTGRES_DB: ${POSTGRES_DB:-odontoflow}
    # Sin puertos publicados a la máquina: solo accesible desde la red interna.
    mem_limit: 768m
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odontoflow} -d ${POSTGRES_DB:-odontoflow}"]
      interval: 5s
      timeout: 3s
      retries: 10

  lycet:
    build:
      context: ./.references/lycet
    image: odontoflow-lycet:prod
    container_name: odontoflow-lycet-prod
    restart: unless-stopped
    environment:
      CLIENT_TOKEN: ${LYCET_TOKEN:?LYCET_TOKEN obligatorio (no uses el default 123456)}
      CORS_ALLOW_ORIGIN: .
    mem_limit: 512m
    # Sin puerto publicado: web lo llama por la red interna (http://lycet:8000).
    volumes:
      - lycetdata:/var/www/html/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      # Contexto en la raíz del monorepo: el Dockerfile necesita package-lock.json,
      # packages/* y tsconfig.base.json para npm ci con workspaces.
      context: .
      dockerfile: apps/web/Dockerfile
    image: odontoflow-web:prod
    container_name: odontoflow-web-prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      lycet:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3111"
      HOSTNAME: 0.0.0.0
      # packages/db/src/client.ts extrae host/puerto de DATABASE_URL para su sondeo TCP
      # (packages/db/src/client.ts); dentro de la red el host es `db`.
      DATABASE_URL: postgres://${POSTGRES_USER:-odontoflow}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatorio (ver .env.prod.example)}@${DATABASE_HOST:-db}:5432/${POSTGRES_DB:-odontoflow}
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET obligatorio (genera uno aleatorio, ver .env.prod.example)}
      LYCET_URL: http://lycet:8000
      LYCET_TOKEN: ${LYCET_TOKEN:?LYCET_TOKEN obligatorio (no uses el default 123456)}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL obligatorio (URL publica HTTPS, ver .env.prod.example)}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      # resend es el canal de producción; smtp-dev solo existe en docker-compose.yml (Mailpit).
      MAIL_MODE: ${MAIL_MODE:-resend}
      WA_REPLY_MODE: ${WA_REPLY_MODE:-single}
      YAPE_PLIN_NUMBER: ${YAPE_PLIN_NUMBER:-}
      # DEPRECADO: solo bootstrap inicial del fundador (is_platform_admin); se ignora en runtime.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      LOCAL_MASTER_KEY: ${LOCAL_MASTER_KEY:?LOCAL_MASTER_KEY obligatorio (define UNA vez, ver .env.prod.example)}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      # Tamaño del pool postgres-js (packages/db/src/client.ts). Default 10.
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
    volumes:
      # La app guarda adjuntos en <cwd>/.data/attachments => /app/apps/web/.data/attachments.
      - attachments:/app/apps/web/.data
    # Límite de memoria para que un heap hinchado de Node no mate a Postgres
    # en la máquina única del piloto.
    mem_limit: 1536m
    healthcheck:
      # /api/health valida app + conexión a DB (devuelve 503 sin DB).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3111/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2
    container_name: odontoflow-caddy-prod
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      # Placeholders del Caddyfile: {$APP_DOMAIN:...} / {$WWW_DOMAIN:...}.
      APP_DOMAIN: ${APP_DOMAIN:-app.marsmode.me}
      WWW_DOMAIN: ${WWW_DOMAIN:-www.marsmode.me}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    mem_limit: 128m
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Cloudflare Tunnel (solo si el equipo está detrás de CGNAT: piloto en casa).
  # Modo token: se crea el tunnel en Cloudflare Zero Trust y su token va en
  # CLOUDFLARE_TUNNEL_TOKEN; el ingress se configura en el dashboard
  # (app.domain -> http://web:3111; el TLS lo termina el edge de Cloudflare,
  # tal como corrió el piloto). NO hay archivos de credenciales en el repo.
  # Caddy queda fuera del túnel (es para VPS/Azure con IP pública).
  # Uso: docker compose -f docker-compose.prod.yml --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: odontoflow-cloudflared-prod
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN requerido para el perfil tunnel}
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 256m
    dns:
      - 1.1.1.1
      - 8.8.8.8

  # Solo herramientas: no arranca con `up` (profile tools).
  # La imagen standalone de `web` no incluye drizzle-kit ni las migraciones SQL,
  # por eso migrate usa el stage de build completo del mismo Dockerfile.
  # Uso: docker compose -f docker-compose.prod.yml run --rm migrate npm run db:migrate
  #      docker compose -f docker-compose.prod.yml run --rm migrate npm run db:seed
  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: build
    image: odontoflow-web-build:prod
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-odontoflow}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatorio (ver .env.prod.example)}@${DATABASE_HOST:-db}:5432/${POSTGRES_DB:-odontoflow}
    depends_on:
      db:
        condition: service_healthy

  cron:
    build:
      context: ./docker/cron
    image: odontoflow-cron:prod
    container_name: odontoflow-cron-prod
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET obligatorio (genera uno aleatorio, ver .env.prod.example)}
      # Credenciales para el respaldo diario de la BD (backup-db.sh → /backups).
      POSTGRES_USER: ${POSTGRES_USER:-odontoflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatorio (ver .env.prod.example)}
      POSTGRES_DB: ${POSTGRES_DB:-odontoflow}
      DATABASE_HOST: ${DATABASE_HOST:-db}
      DATABASE_PORT: "5432"
      # Opcionales: pings de monitoreo (healthchecks.io) para los respaldos.
      HEALTHCHECK_DB: ${HEALTHCHECK_DB:-}
      HEALTHCHECK_OFFSITE: ${HEALTHCHECK_OFFSITE:-}
      # Opcional: destino off-site de /backups para backup-offsite.sh (ej: b2:odontoflow).
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      # HOME del usuario no privilegiado: rclone busca $HOME/.config/rclone/rclone.conf.
      HOME: /home/supercronic
    mem_limit: 512m
    volumes:
      # ./backups del host: pg_dump diario, retención 30 días (gitignored).
      - ./backups:/backups
      # Fuentes de los tar.gz de backup-offsite.sh (adjuntos de web y data fiscal
      # de Lycet). Solo lectura: cron jamás debe poder escribir estos volúmenes.
      - attachments:/mnt/attachments:ro
      - lycetdata:/mnt/fiscal:ro
      # Opcional: config de rclone desde el usuario del host (B2/S3 con su app key).
      - ${HOME:-/root}/.config/rclone:/home/supercronic/.config/rclone:ro

volumes:
  pgdata:
  lycetdata:
  attachments:
  caddy_data:
  caddy_config:
