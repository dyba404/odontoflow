services:
  db:
    image: postgres:16
    container_name: odontoflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: odontoflow
      POSTGRES_PASSWORD: odontoflow_dev
      POSTGRES_DB: odontoflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odontoflow -d odontoflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  lycet:
    build:
      context: ./.references/lycet
    image: odontoflow-lycet:local
    container_name: odontoflow-lycet
    restart: unless-stopped
    environment:
      CLIENT_TOKEN: ${LYCET_TOKEN:-123456}
      CORS_ALLOW_ORIGIN: .
    ports:
      - "8090:8000"
    volumes:
      - lycetdata:/var/www/html/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    container_name: odontoflow-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  lycetdata:
