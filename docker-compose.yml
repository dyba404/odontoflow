services:
  db:
    image: postgres:16
    container_name: odontoflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: odontoflow
      POSTGRES_PASSWORD: odontoflow_dev
      POSTGRES_DB: odontoflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odontoflow -d odontoflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
