name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck (4 workspaces)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests core
        run: npm test

      - name: Tests unitarios web
        run: npm run test:unit -w @odontoflow/web
